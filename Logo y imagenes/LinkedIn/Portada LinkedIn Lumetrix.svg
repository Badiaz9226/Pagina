<svg xmlns="http://www.w3.org/2000/svg" width="4200" height="700" viewBox="0 0 4200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A2F"/>
      <stop offset="0.58" stop-color="#0B2545"/>
      <stop offset="1" stop-color="#123A64"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B1D7" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#00B1D7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2E74B5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="4200" height="700" fill="url(#bg)"/>
  <rect width="4200" height="700" fill="url(#grid)"/>

  <path d="M1850 -80 L3580 700 L2970 700 L1500 35 Z" fill="url(#beam)"/>
  <path d="M2140 -90 L3790 700" fill="none" stroke="#00B1D7" stroke-opacity="0.16" stroke-width="4"/>
  <path d="M2360 -70 L4000 700" fill="none" stroke="#2E74B5" stroke-opacity="0.24" stroke-width="3"/>

  <g transform="translate(610 170)">
    <text x="0" y="130" fill="#FFFFFF" font-family="Sora, Manrope, Arial, sans-serif" font-size="154" font-weight="700" letter-spacing="11">LUMETRIX</text>
    <rect x="2" y="178" width="132" height="10" rx="5" fill="#00B1D7"/>
    <rect x="146" y="178" width="58" height="10" rx="5" fill="#21BF73"/>
    <text x="0" y="282" fill="#F4F7FA" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="500">Claridad para decidir. Apoyo que se siente.</text>
    <text x="0" y="370" fill="#B9D5EA" font-family="Inter, Arial, sans-serif" font-size="39" font-weight="500" letter-spacing="1.5">SOCIAL MEDIA  ·  PAID MEDIA  ·  ESTRATEGIA DE EMBUDOS  ·  ESPAÑOL / ENGLISH</text>
  </g>

  <g transform="translate(3400 350)">
    <circle r="235" fill="#061727" fill-opacity="0.58" stroke="#2E74B5" stroke-opacity="0.38" stroke-width="3"/>
    <circle r="192" fill="#0B2545" stroke="#00B1D7" stroke-opacity="0.22" stroke-width="2"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-126 -94 L-22 -16" stroke="#2E74B5" stroke-width="14" opacity="0.9"/>
      <path d="M-142 0 H-22" stroke="#00B1D7" stroke-width="14" opacity="0.95"/>
      <path d="M-126 94 L-22 16" stroke="#2E74B5" stroke-width="14" opacity="0.9"/>
      <path d="M-6 0 L116 -88" stroke="#00B1D7" stroke-width="20"/>
    </g>
    <circle cx="-6" cy="0" r="24" fill="#FFFFFF"/>
    <circle cx="50" cy="-40" r="14" fill="#2E74B5"/>
    <circle cx="91" cy="-70" r="18" fill="#00B1D7"/>
    <circle cx="122" cy="-92" r="22" fill="#21BF73"/>
    <circle cx="224" cy="-88" r="12" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="250" cy="-42" r="18" fill="#00B1D7" filter="url(#glow)"/>
    <circle cx="214" cy="16" r="24" fill="#21BF73"/>
  </g>

  <circle cx="4060" cy="104" r="5" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="3990" cy="140" r="8" fill="#00B1D7" opacity="0.7"/>
  <circle cx="4120" cy="182" r="11" fill="#21BF73" opacity="0.75"/>
